name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode HTML entities in Gradle files
        run: |
          find . -name "*.gradle.kts" -not -path "*/build/*" -print0 | xargs -0 sed -i \
            -e 's/&quot;/"/g' \
            -e "s/&#39;/'/g" \
            -e 's/&lt;/</g' \
            -e 's/&gt;/>/g' \
            -e 's/&amp;/\&/g'
          grep -nE '&quot;|&lt;|&gt;|&amp;|&#' $(find . -name "*.gradle.kts" -not -path "*/build/*") || echo "No entities left"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMusicPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
